
name: SmartCart AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================================
  # JAVA MICROSERVICES
  # =====================================================
  java-services:
    name: Java - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            database: smartcart_auth_db
          - service: product-service
            database: smartcart_product_db
          - service: inventory-service
            database: smartcart_inventory_db
          - service: order-service
            database: smartcart_order_db
          - service: payment-service
            database: smartcart_payment_db
          - service: notification-service
            database: smartcart_notification_db

    services:
      mysql:
        image: mysql:8.2
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Create isolated CI databases
        env:
          MYSQL_PWD: ci-root-password
        run: |
          mysql -h 127.0.0.1 -uroot -e "
            CREATE DATABASE IF NOT EXISTS smartcart_auth_db;
            CREATE DATABASE IF NOT EXISTS smartcart_product_db;
            CREATE DATABASE IF NOT EXISTS smartcart_inventory_db;
            CREATE DATABASE IF NOT EXISTS smartcart_order_db;
            CREATE DATABASE IF NOT EXISTS smartcart_payment_db;
            CREATE DATABASE IF NOT EXISTS smartcart_notification_db;
          "

      - name: Make Maven Wrapper executable
        working-directory: backend/${{ matrix.service }}
        run: chmod +x mvnw

      - name: Build and test
        working-directory: backend/${{ matrix.service }}
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/${{ matrix.database }}
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci-root-password
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          JWT_SECRET: ci-only-secret-key-not-for-production-0123456789
          SPRING_MAIL_USERNAME: ci-test-user
          SPRING_MAIL_PASSWORD: ci-test-password
          NOTIFICATION_INTERNAL_SECRET: ci-only-notification-secret
          RAZORPAY_KEY_ID: ci-test-key
          RAZORPAY_KEY_SECRET: ci-test-secret
          INVENTORY_SERVICE_URL: http://localhost:8082
          SERVICES_ORDER_URL: http://localhost:8083
        run: ./mvnw -B clean verify

  # =====================================================
  # .NET ADMIN SERVICE
  # =====================================================
  admin-service:
    name: .NET Admin Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore admin-service/admin-service.csproj

      - name: Build Admin Service
        run: dotnet build admin-service/admin-service.csproj --no-restore --configuration Release

  # =====================================================
  # CUSTOMER / SELLER FRONTEND
  # =====================================================
  customer-seller-frontend:
    name: Customer/Seller Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # =====================================================
  # ADMIN FRONTEND
  # =====================================================
  admin-frontend:
    name: Admin Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # =====================================================
  # PYTHON AI SERVICE
  # =====================================================
  ai-service:
    name: Python AI Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run AI tests
        env:
          JWT_SECRET: ci-only-secret-key-not-for-production-0123456789
          PRODUCT_SERVICE_URL: http://localhost:8081
          ORDER_SERVICE_URL: http://localhost:8083
        run: python -m pytest tests -v
