server {
    listen 80;
    server_name _;
    client_max_body_size 5M;
    root /usr/share/nginx/html;
    index index.html;

        # Serve uploaded product images through Product Service
    location /uploads/ {
        proxy_pass http://product-service:8081;
        proxy_set_header Host $host;
    }

    location /api/auth/ { proxy_pass http://auth-service:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /api/products { proxy_pass http://product-service:8081; proxy_set_header Host $host; }
    location = /api/categories { proxy_pass http://product-service:8081; proxy_set_header Host $host; }
    location /api/products/ { proxy_pass http://product-service:8081; proxy_set_header Host $host; }
    location /api/categories/ { proxy_pass http://product-service:8081; proxy_set_header Host $host; }
    location = /api/inventory { proxy_pass http://inventory-service:8082; proxy_set_header Host $host; }
    location /api/inventory/ { proxy_pass http://inventory-service:8082; proxy_set_header Host $host; }
    location = /api/orders { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location /api/orders/ { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location = /api/carts { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location /api/carts/ { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location = /api/cart-items { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location /api/cart-items/ { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location = /api/order-items { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location /api/order-items/ { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location = /api/addresses { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location /api/addresses/ { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location = /api/wishlist { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location /api/wishlist/ { proxy_pass http://order-service:8083; proxy_set_header Host $host; }
    location = /api/payments { proxy_pass http://payment-service:8084; proxy_set_header Host $host; }
    location /api/payments/ { proxy_pass http://payment-service:8084; proxy_set_header Host $host; }
    location /api/ai/ { proxy_pass http://ai-service:8000; proxy_set_header Host $host; }
    location /health { proxy_pass http://ai-service:8000/health; }
    location /api/notifications/ { proxy_pass http://notification-service:8085; proxy_set_header Host $host; }

    location / { try_files $uri $uri/ /index.html; }
}
